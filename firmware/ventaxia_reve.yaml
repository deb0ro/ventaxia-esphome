button:
  - platform: template
    name: "Boost"
    icon: mdi:fan-plus
    on_press:
      - lambda: |-
          id(boost_end) = millis() + (uint32_t) (id(boost_minutes).state * 60000.0f);
          if (id(boost_end) == 0) id(boost_end) = 1;
      - script.execute: control
  - platform: template
    name: "Boost cancel"
    icon: mdi:fan-minus
    on_press:
      - lambda: id(boost_end) = 0;
      - script.execute: control
  - platform: template
    name: "Fireplace"
    icon: mdi:fireplace
    on_press:
      - lambda: |-
          id(fire_end) = millis() + (uint32_t) (id(fire_minutes).state * 60000.0f);
          if (id(fire_end) == 0) id(fire_end) = 1;
      - script.execute: control
  - platform: template
    name: "Fireplace cancel"
    icon: mdi:fireplace-off
    on_press:
      - lambda: id(fire_end) = 0;
      - script.execute: control
  - platform: template
    name: "Filter recalibrate"     # new clean-filter reference WITHOUT resetting the filter age (review 4)
    icon: mdi:tune-variant
    entity_category: config
    on_press:
      - lambda: |-
          auto &c = id(cfg);
          for (int i = 46; i < 82; i++) c[i] = 0;
          for (int i = 94; i < 100; i++) c[i] = 0;
          c[100] = c[44]; c[101] = c[45];                   // learning windows start at the current run hours
          c[82]++;                                          // RAM learning state reset
          id(fil_dev_e) = NAN; id(fil_dev_s) = NAN;
          id(fil_eval_e) = 0; id(fil_eval_s) = 0;
  - platform: template
    name: "Filter replaced"
    icon: mdi:air-filter
    on_press:
      - lambda: |-
          auto &c = id(cfg);
          auto t = id(sntp_time).now();
          const uint32_t ts = t.is_valid() ? (uint32_t) t.timestamp : 0;
          for (int i = 0; i < 4; i++) c[40 + i] = (ts >> (8 * i)) & 0xFF;
          c[44] = 0; c[45] = 0;
          for (int i = 46; i < 82; i++) c[i] = 0;
          for (int i = 94; i < 102; i++) c[i] = 0;          // completion bits, calibration base = 0
          c[82]++;                                          // filter epoch: the interval resets its RAM state
          id(fil_dev_e) = NAN; id(fil_dev_s) = NAN;
          id(fil_eval_e) = 0; id(fil_eval_s) = 0;

script:
  - id: hood_timeout              # safety: if HA never sends "off" (HA down), leave hood mode after 2 h
    mode: restart
    then:
      - delay: 2h
      - switch.turn_off: hood_on
  - id: manual_timeout            # review P1-3: Manual is a temporary service mode
    mode: restart
    then:
      - delay: 2h
      - lambda: if (id(cfg)[2] == 4) id(cfg)[2] = 0;
      - script.execute: control
  - id: control
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          if (!id(cfg_ready)) return;
          const uint32_t now = millis();
          const bool api_ok = api::global_api_server != nullptr && api::global_api_server->is_connected();
          auto fresh = [now](uint32_t t, uint32_t max_ms) { return t != 0 && (now - t) < max_ms; };

          // ---- inputs and their validity (review P1-4): raw-reading age, not only the median output
          auto temp_ok = [](float t) { return std::isfinite(t) && t > -40.0f && t < 70.0f; };
          float t_ext = id(temp_extract).state;           // TEMP1, air from the house (median-filtered)
          const bool t1_ok = temp_ok(t_ext) && fresh(id(t1_ok_ms), 120000UL);
          bool ext_ok = t1_ok, ext_ha = false, ext_ds = false;
          if (!ext_ok && temp_ok(id(ds_extract).state) && fresh(id(ds_ext_ms), 120000UL)) {   // DS18B20 EXTRACT
            t_ext = id(ds_extract).state; ext_ok = true; ext_ds = true;
          }
          if (!ext_ok && api_ok && temp_ok(id(ha_indoor_t).state) && fresh(id(ha_tin_ms), ${ha_max_age_ms})) {
            t_ext = id(ha_indoor_t).state; ext_ok = true; ext_ha = true;
          }
          float t_out = id(temp_outdoor).state;           // TEMP2, outdoor intake
          const bool t2_ok = temp_ok(t_out) && fresh(id(t2_ok_ms), 120000UL);
          bool out_ok = t2_ok, out_ha = false, out_ds = false;
          if (!out_ok && temp_ok(id(ds_outdoor).state) && fresh(id(ds_out_ms), 120000UL)) {   // DS18B20 OUTDOOR
            t_out = id(ds_outdoor).state; out_ok = true; out_ds = true;
          }
          if (!out_ok && api_ok && temp_ok(id(ha_outdoor).state) && fresh(id(ha_out_ms), ${ha_max_age_ms})) {
            t_out = id(ha_outdoor).state; out_ok = true; out_ha = true;
          }
          if (!id(boot_done) && now >= 120000UL) id(boot_done) = true;
          const bool starting = !id(boot_done);

          int mode = id(cfg)[2];
          if (mode > 4) mode = 0;
          const bool ls = id(ls_boost).state && id(ls_in).state;          // light switch held on
          const bool boost = ls || (id(boost_end) != 0 && (int32_t) (id(boost_end) - now) > 0);
          if (!boost) id(boost_end) = 0;
          const bool fire = id(fire_end) != 0 && (int32_t) (id(fire_end) - now) > 0;
          if (!fire) id(fire_end) = 0;
          const bool hood = id(hood_on).state;
          const bool frost_bypass_mode = id(cfg)[3] & 1;

          float sup, ext;
          std::string why;
          bool bypass = false;
          bool airing = false;

          // ===================== DEMAND =====================
          if (mode == 4) {                                 // Manual: the fans and the bypass from HA
            sup = id(man_sup).state; ext = id(man_ext).state;
            bypass = id(man_bypass).state;
            why = "Manual";
          } else {
            int lvl = (mode == 0) ? 2 : mode;
            if (boost) lvl = 3;
            if (lvl == 1)      { sup = id(low_sup).state;   ext = id(low_ext).state;   why = "Low"; }
            else if (lvl == 3) { sup = id(boost_sup).state; ext = id(boost_ext).state; why = ls ? "Boost (light switch)" : boost ? "Boost (timer)" : "Boost"; }
            else               { sup = id(norm_sup).state;  ext = id(norm_ext).state;  why = (mode == 0) ? "Auto: Normal" : "Normal"; }

            // night mode: Auto only, not during a boost; window may cross midnight
            if (mode == 0 && !boost && id(night_mode).state) {
              auto tnow = id(sntp_time).now();
              if (tnow.is_valid()) {
                const int m = tnow.hour * 60 + tnow.minute;
                const int dow = tnow.day_of_week;           // 1 = Sunday ... 7 = Saturday
                const bool we = id(weekend_night).state;
                const bool we_eve = we && (dow == 6 || dow == 7);   // Fri / Sat evening
                const bool we_mor = we && (dow == 7 || dow == 1);   // Sat / Sun morning
                const int woff = 60 * (int) lroundf(id(purge_we_h).state);   // "Weekend airing offset"
                const int s = (id(night_start).hour * 60 + id(night_start).minute + (we_eve ? woff : 0)) % 1440;
                // Fri / Sat evening start and Sat / Sun morning end: weekday time + offset (one setting moves the
                // night AND the airings)
                const int e = (id(night_end).hour * 60 + id(night_end).minute + (we_mor ? woff : 0)) % 1440;
                const bool night = (s <= e) ? (m >= s && m < e) : (m >= s || m < e);
                if (night) { sup = id(night_sup).state; ext = id(night_ext).state; why = "Auto: Night"; }
              }
            }
            // holiday: instead of Auto / Low / Normal (incl. night), not Boost
            if (id(holiday_mode).state && !boost && mode != 3) {
              sup = id(hol_sup).state; ext = id(hol_ext).state; why = "Holiday";
            }
            // scheduled airing: Auto, not on holiday / during a boost; window may cross midnight
            if (mode == 0 && !boost && !id(holiday_mode).state) {
              auto tnow = id(sntp_time).now();
              if (tnow.is_valid()) {
                const int m = tnow.hour * 60 + tnow.minute;
                const int dur = (int) id(purge_minutes).state;
                int st[3] = {id(purge_1).hour * 60 + id(purge_1).minute, id(purge_2).hour * 60 + id(purge_2).minute,
                             id(purge_3).hour * 60 + id(purge_3).minute};
                // weekend (Sat / Sun with "Weekend night times"): all airings move by "Weekend airing offset" hours
                // (default +1 h -> 09:00 / 13:00 / 20:00), 18.10.2026
                const int dow = tnow.day_of_week;           // 1 = Sunday ... 7 = Saturday
                if (id(weekend_night).state && (dow == 7 || dow == 1)) {
                  const int off = 60 * (int) lroundf(id(purge_we_h).state);
                  for (int i = 0; i < 3; i++) st[i] = (st[i] + off) % 1440;
                }
                for (int i = 0; i < 3 && !airing; i++) {
                  if (!((id(cfg)[84] >> i) & 1)) continue;
                  if ((m - st[i] + 1440) % 1440 < dur) {
                    airing = true;
                    char b[24]; snprintf(b, sizeof(b), "Airing %d (%02d:%02d)", i + 1, st[i] / 60, st[i] % 60);
                    sup = id(purge_sup).state; ext = id(purge_ext).state; why = b;
                  }
                }
              }
            }
          }
          if (fire) { sup = id(fire_sup).state; ext = id(fire_ext).state; why = "Fireplace (timer)"; }

          // summer bypass (not in Manual) with hysteresis, at most one change per 10 min
          if (mode != 4) {
            const bool cur = id(bypass_relay).state && !id(frost_active) && !id(frost_safe);   // open for summer?
            bool want = cur;
            if (!id(summer_mode).state || !ext_ok || !out_ok || starting) want = false;
            else {
              const float ct = id(comfort_temp).state, om = id(outdoor_min).state;
              if (!cur && t_ext > ct && t_out < t_ext - 2.0f && t_out > om) want = true;
              if (cur && (t_ext < ct - 2.0f || t_out > t_ext - 1.0f || t_out < om - 1.0f)) want = false;
            }
            const bool may = !id(bypass_changed_once) || (now - id(bypass_changed)) > 600000UL || !want;
            bypass = (want != cur && may) ? want : cur;
            if (bypass) why += ", summer bypass";
            // free cooling: Auto (holiday included), not during boost / fireplace / hood
            if (bypass && id(free_cooling).state && mode == 0 && !boost && !fire && !hood && t_out < t_ext - 3.0f) {
              sup = std::max(sup, id(cool_sup).state);
              ext = std::max(ext, id(cool_ext).state);
              why += ", free cooling";
            }
          }
          // cooker hood: make-up air only
          if (hood) { sup = id(hood_sup).state; ext = id(hood_ext).state; bypass = false; why = "Cooker hood: supply only"; }

          // ===================== PROTECTIONS (all modes) =====================
          // start: no outdoor temperature yet -> Low, no bypass
          if (starting && !out_ok) {
            sup = std::min(sup, id(low_sup).state); ext = std::min(ext, id(low_ext).state);
            bypass = false;
            why += ", starting";
          }
          // house too cold (heating failure): stop, 5 min test run every hour
          // (review 2, P1-2) without a valid house temperature an active stop is KEPT, never released
          if (ext_ok && !id(cold_stop) && t_ext < 5.0f) { id(cold_stop) = true; id(cold_since) = now; }
          if (id(cold_stop)) {
            const uint32_t el = now - id(cold_since);
            const bool test = el >= 3600000UL && (el % 3600000UL) < 300000UL;
            if (test && ext_ok && t_ext > 7.0f) id(cold_stop) = false;
            if (id(cold_stop)) {
              if (test) { sup = id(low_sup).state; ext = id(low_ext).state; why = "Room too cold: test run"; }
              else      { sup = 0; ext = 0; why = "Room too cold: fans off"; }
              bypass = false;
            }
          }
          // dry air: cap at Low in Auto (also over free cooling); RH from HA must be fresh (review P2-7)
          {
            float rh = id(indoor_rh).state;
            bool rh_ok = api_ok && !std::isnan(rh) && rh > 5.0f && rh < 100.0f && fresh(id(rh_ms), ${ha_max_age_ms});
            if (!rh_ok) {                                  // local SHT4x when the HA humidity is missing
              rh = id(sht_rh).state;
              rh_ok = std::isfinite(rh) && rh > 5.0f && rh < 100.0f && fresh(id(sht_ms), 300000UL);
            }
            if (!rh_ok || !id(dry_protect).state) id(dry_active) = false;
            else if (!id(dry_active) && rh < id(rh_min).state) id(dry_active) = true;
            else if (id(dry_active) && rh > id(rh_min).state + 3.0f) id(dry_active) = false;
            if (id(dry_active) && mode == 0 && !boost && !airing && !fire && !hood && !id(cold_stop) &&
                (sup > id(low_sup).state || ext > id(low_ext).state)) {
              sup = std::min(sup, id(low_sup).state); ext = std::min(ext, id(low_ext).state);
              why += ", dry air: Low";
            }
          }
          // frost (review P1-2 / P1-4): applied after everything else, never undone by a later branch
          const float fs = id(frost_start).state;
          id(frost_safe) = !out_ok && !starting;
          if (!out_ok) { /* keep frost_active as it was; the safe mode below covers it */ }
          else if (!id(frost_active) && t_out < fs) { id(frost_active) = true; id(frost_since) = now; }
          else if (id(frost_active) && t_out > fs + 1.0f) id(frost_active) = false;
          if ((id(frost_safe) || id(frost_active)) && !frost_bypass_mode) bypass = false;   // Airflow: through the core
          if (id(frost_safe)) {
            if (frost_bypass_mode) {
              bypass = true;
              sup = std::min(sup, id(low_sup).state); ext = std::min(ext, id(low_ext).state);
              why += ", no outdoor temperature: frost safe (bypass, Low)";
            } else {
              sup = std::min(sup, id(low_sup).state * 0.5f); ext = std::min(ext, id(low_ext).state);
              why += ", no outdoor temperature: frost safe (supply half Low)";
            }
          } else if (id(frost_active)) {
            if (frost_bypass_mode) {
              if (sup > 0) bypass = true;                  // cold fresh air past the core, also with the hood
              why += ", frost: bypass";
            } else if (t_out <= -20.0f) {
              sup = 0; ext = std::min(ext, id(low_ext).state);
              why += ", frost: supply off";
            } else if (t_out < -10.0f) {
              const uint32_t minute = ((now - id(frost_since)) / 60000UL) % 60UL;
              sup = (minute < 15) ? 0.0f : sup * 0.5f;
              ext = std::min(100.0f, ext * 1.2f);
              why += (minute < 15) ? ", frost: supply pause" : ", frost: supply 50 %";
            } else {
              const float k = 1.0f - 0.5f * std::min(1.0f, std::max(0.0f, (fs - t_out) / (fs + 10.0f)));
              sup *= k;
              ext = std::min(100.0f, ext * 1.2f);
              char b[32]; snprintf(b, sizeof(b), ", frost: supply %d %%", (int) (k * 100));
              why += b;
            }
          }
          // fan faults (review 3): latched state, fixed policy, the stop bypasses the comfort ramp
          bool stop_ext = false, stop_sup = false;
          {
            static uint32_t bad_since[2] = {0, 0}, good_since[2] = {0, 0};
            static bool bad_run[2] = {false, false}, good_run[2] = {false, false};   // timer running (review 4)
            const float cur[2] = {id(cur_ext), id(cur_sup)};
            const float rp[2] = {id(fan1_rpm).state, id(fan2_rpm).state};
            bool *lat[2] = {&id(ext_fault_l), &id(sup_fault_l)};
            const bool was_both = id(ext_fault_l) && id(sup_fault_l);
            for (int f = 0; f < 2; f++) {
              const bool good = std::isfinite(rp[f]) && rp[f] >= 100.0f;
              const bool driven = cur[f] > 20.0f;
              if (!*lat[f]) {
                good_run[f] = false;
                if (id(boot_done) && driven && !good) {
                  if (!bad_run[f]) { bad_run[f] = true; bad_since[f] = now; }
                  else if ((uint32_t) (now - bad_since[f]) >= 60000UL) { *lat[f] = true; bad_run[f] = false; }
                } else bad_run[f] = false;
              } else {
                bad_run[f] = false;
                if (driven && good) {
                  if (!good_run[f]) { good_run[f] = true; good_since[f] = now; }
                  else if ((uint32_t) (now - good_since[f]) >= 30000UL) { *lat[f] = false; good_run[f] = false; }
                } else good_run[f] = false;
              }
            }
            const bool fe = id(ext_fault_l), fsu = id(sup_fault_l);
            if (fe && fsu) {
              if (!was_both) id(fault_t) = now;
              const bool test = ((now - id(fault_t)) % 900000UL) >= 780000UL;
              if (test) {
                sup = std::min(sup, (float) ${fault_test_pct}); ext = std::min(ext, (float) ${fault_test_pct});
                why += ", BOTH FANS FAULT: test run";
              } else {
                sup = 0; ext = 0; stop_ext = stop_sup = true;
                why += ", BOTH FANS FAULT: stopped";
              }
            } else if (fsu) {
              ext = std::min(ext, (float) ${fault_other_pct}); stop_ext = true;
              why += ", SUPPLY FAN FAULT: extract stopped";
            } else if (fe) {
              sup = std::min(sup, (float) ${fault_other_pct}); stop_sup = true;
              why += ", EXTRACT FAN FAULT: supply stopped";
            }
          }
          if (!t1_ok) why += ext_ds ? ", TEMP1 fault (DS18B20 EXTRACT)"
                           : ext_ha ? ", TEMP1 fault (house temperature from HA)" : ", TEMP1 fault";
          if (!t2_ok) why += out_ds ? ", TEMP2 fault (DS18B20 OUTDOOR)"
                           : out_ha ? ", TEMP2 fault (outdoor from HA)" : ", TEMP2 fault";

          // ===================== OUTPUT =====================
          sup = std::min(100.0f, std::max(0.0f, sup));
          ext = std::min(100.0f, std::max(0.0f, ext));
          id(tgt_ext) = ext;                              // FAN1 = extract, applied by the ramp interval
          id(tgt_sup) = sup;                              // FAN2 = supply
          if (stop_ext && id(cur_ext) > ext) { id(cur_ext) = ext; id(fan1_pwm).set_level(ext / 100.0f); }   // no ramp
          if (stop_sup && id(cur_sup) > sup) { id(cur_sup) = sup; id(fan2_pwm).set_level(sup / 100.0f); }
          if (bypass != id(bypass_relay).state) {
            if (bypass) id(bypass_relay).turn_on(); else id(bypass_relay).turn_off();
            id(bypass_changed) = now;
            id(bypass_changed_once) = true;
          }
          if (id(sup_level).state != sup) id(sup_level).publish_state(sup);
          if (id(ext_level).state != ext) id(ext_level).publish_state(ext);
          if (id(ctl_state).state != why) id(ctl_state).publish_state(why);

interval:
  - interval: 10s
    then:
      - script.execute: control
  # Soft ramp: no speed jumps (quieter mode changes, soft start after boot), "Fan ramp rate" %/s
  - interval: 1s
    then:
      - lambda: |-
          const float st = std::max(0.5f, id(ramp_rate).state);
          auto mv = [st](float &c, float t) { if (fabsf(t - c) <= st) c = t; else c += (t > c) ? st : -st; };
          mv(id(cur_ext), id(tgt_ext));
          mv(id(cur_sup), id(tgt_sup));
          // write the PWM only when the level changes (18.10.2026): on the ESP8266 every set_level() restarts the
          // software PWM waveform, i.e. a glitch once per second at a steady level - suspected cause of the louder
          // fans at night. The stop path in the control script writes directly; that is caught by the compare.
          static float last_e = -1.0f, last_s = -1.0f;
          if (id(cur_ext) != last_e) { last_e = id(cur_ext); id(fan1_pwm).set_level(last_e / 100.0f); }   // FAN1 = extract
          if (id(cur_sup) != last_s) { last_s = id(cur_sup); id(fan2_pwm).set_level(last_s / 100.0f); }   // FAN2 = supply
  # Filter: run hours and clog estimate. A clogging filter changes the fan load, so at the same PWM the fan turns
  # at a different speed. The clean rpm is learned per 5 % PWM step (stored as rpm/16 in cfg). Samples only with a
  # steady level (60 s), level on a 5 % step, bypass closed, cooker hood off (they change the duct pressure).
  - interval: 10s
    then:
      - lambda: |-
          if (!id(cfg_ready)) return;
          static float last[2] = {-1.0f, -1.0f};
          static uint32_t since[2] = {0, 0};
          static uint32_t run_ms = 0;
          static float ema[2][18];
          static uint8_t n[2][18];
          static bool seen[2][18];
          static int epoch = -1;
          auto &c = id(cfg);
          if (epoch != c[82]) {                             // "Filter replaced" (review 2, P2-5)
            epoch = c[82]; run_ms = 0;
            for (int f = 0; f < 2; f++) for (int k = 0; k < 18; k++) { ema[f][k] = 0; n[f][k] = 0; seen[f][k] = false; }
            last[0] = last[1] = -1.0f;
          }
          const uint32_t now = millis();
          auto t = id(sntp_time).now();
          uint32_t ts = c[40] | (c[41] << 8) | (c[42] << 16) | ((uint32_t) c[43] << 24);
          if (ts == 0 && t.is_valid()) {
            ts = (uint32_t) t.timestamp;
            for (int i = 0; i < 4; i++) c[40 + i] = (ts >> (8 * i)) & 0xFF;
          }
          uint32_t run_h = c[44] | (c[45] << 8);
          const float lv[2] = {id(cur_ext), id(cur_sup)};   // applied (ramped) PWM
          const float rpm[2] = {id(fan1_rpm).state, id(fan2_rpm).state};
          if (lv[0] > 0.0f || lv[1] > 0.0f) {
            run_ms += 10000;
            if (run_ms >= 3600000UL && run_h < 65535) {
              run_ms -= 3600000UL; run_h++;
              c[44] = run_h & 0xFF; c[45] = run_h >> 8;    // one cfg write per run hour
            }
          }
          const uint32_t cal_h = run_h - std::min(run_h, (uint32_t) (c[100] | (c[101] << 8)));   // since calibration
          const bool learning = cal_h < ${filter_learn_h};
          const bool quiet = !id(bypass_relay).state && !id(hood_on).state;
          float *dev[2] = {&id(fil_dev_e), &id(fil_dev_s)};
          uint32_t *eval[2] = {&id(fil_eval_e), &id(fil_eval_s)};
          for (int f = 0; f < 2; f++) {
            if (std::isnan(lv[f]) || lv[f] != last[f]) { last[f] = lv[f]; since[f] = now; continue; }
            const int bin = (int) lroundf(lv[f] / 5.0f);
            if (!quiet || (now - since[f]) < 60000UL || std::isnan(rpm[f]) || rpm[f] < 100.0f) continue;
            if (bin < 3 || bin > 20 || fabsf(lv[f] - bin * 5.0f) > 0.5f) continue;   // 15-100 %, exact steps only
            const int k = bin - 3;
            uint8_t &r = c[46 + f * 18 + k];
            uint8_t &db = c[94 + f * 3 + k / 8];             // completion bit of this step (survives a reboot)
            const uint8_t dm = 1 << (k % 8);
            if (!seen[f][k]) { seen[f][k] = true; ema[f][k] = r * 16.0f; }   // continue an unfinished reference
            const bool done = db & dm;
            // learn: everything in the first ${filter_learn_h} h; later only steps whose reference is not complete
            if (learning || (!done && cal_h < ${filter_late_h})) {
              if (n[f][k] < 255) n[f][k]++;
              ema[f][k] = (ema[f][k] <= 0.0f) ? rpm[f] : ema[f][k] + (rpm[f] - ema[f][k]) / 8.0f;
              r = (uint8_t) std::min(255L, std::max(1L, lroundf(ema[f][k] / 16.0f)));
              if (n[f][k] >= 60) db |= dm;                   // 10 min of samples in one run = complete
            }
            if (!(db & dm) || r == 0) continue;               // unfinished reference: not used
            const float d = (rpm[f] - r * 16.0f) * 100.0f / (r * 16.0f);
            *dev[f] = std::isnan(*dev[f]) ? d : *dev[f] + 0.01f * (d - *dev[f]);   // ~17 min time constant
            *eval[f] = now;
          }
  # NTCs (rev E): each on its own ADC1 input, 10k pull-up to 3.3 V, NTC to GND, 1k + 100n -> R = 10k V / (3.3 - V).
  # A reading counts as valid (t1_ok_ms / t2_ok_ms) only when R is plausible: 500 Ohm .. 150 kOhm (~+90 .. -40 C).
  # Open NTC -> ~3.3 V (above the ADC range), short -> 0 V: both rejected.
  - interval: ${ntc_interval}
    then:
      - component.update: ntc1_adc
      - component.update: ntc2_adc
      - delay: 100ms
      - lambda: |-
          const float vs = 3.3f, rp = 10000.0f;
          auto res = [vs, rp](float v) { return (std::isfinite(v) && v > 0.02f && v < vs - 0.05f) ? rp * v / (vs - v) : NAN; };
          const float r1 = res(id(ntc1_adc).state), r2 = res(id(ntc2_adc).state);
          const bool g1 = std::isfinite(r1) && r1 > 500.0f && r1 < 150000.0f;
          const bool g2 = std::isfinite(r2) && r2 > 500.0f && r2 < 150000.0f;
          if (g1) id(t1_ok_ms) = millis();
          if (g2) id(t2_ok_ms) = millis();
          id(ntc1_r).publish_state(g1 ? r1 : NAN);
          id(ntc2_r).publish_state(g2 ? r2 : NAN);

text_sensor:
  - platform: template
    id: ctl_state
    name: "Control state"
    icon: mdi:state-machine
    update_interval: never
  - platform: template
    name: "Filter state"
    icon: mdi:air-filter
    update_interval: 60s
    lambda: |-
      if (!id(cfg_ready)) return {};
      auto &c = id(cfg);
      char b[72];
      const uint32_t now = millis();
      const uint32_t ts = c[40] | (c[41] << 8) | (c[42] << 16) | ((uint32_t) c[43] << 24);
      const uint32_t run_h = c[44] | (c[45] << 8);
      if (ts == 0) return std::string("Waiting for time");
      auto t = id(sntp_time).now();
      const int age = t.is_valid() ? (int) (((int64_t) t.timestamp - (int64_t) ts) / 86400) : 0;
      if (age >= (int) id(filter_days).state) { snprintf(b, sizeof(b), "Change due (%d days)", age); return std::string(b); }
      const uint32_t cal_h = run_h - std::min(run_h, (uint32_t) (c[100] | (c[101] << 8)));
      if (cal_h < ${filter_learn_h}) {
        snprintf(b, sizeof(b), "Learning clean reference (%u/%s h)", (unsigned) cal_h, "${filter_learn_h}");
        return std::string(b);
      }
      const bool fe = id(fil_eval_e) != 0 && (now - id(fil_eval_e)) < ${fil_fresh_ms};   // same window as the alarm
      const bool fsp = id(fil_eval_s) != 0 && (now - id(fil_eval_s)) < ${fil_fresh_ms};
      if (!fe && !fsp) {
        const uint32_t le = std::max(id(fil_eval_e), id(fil_eval_s));
        if (le == 0) return std::string("Not evaluated yet (needs a steady level, bypass closed, no hood)");
        snprintf(b, sizeof(b), "Not measuring now (last sample %u min ago)", (unsigned) ((now - le) / 60000UL));
        return std::string(b);
      }
      const float al = id(filter_alarm).state;
      const float de = fe ? id(fil_dev_e) : NAN, ds = fsp ? id(fil_dev_s) : NAN;
      if (fabsf(de) > al || fabsf(ds) > al) {
        snprintf(b, sizeof(b), "Clogged? extract %+.0f %%, supply %+.0f %%", de, ds); return std::string(b);
      }
      if (!fe || !fsp) return std::string(fe ? "OK (supply: cannot evaluate)" : "OK (extract: cannot evaluate)");
      return std::string("OK");

binary_sensor:
  - platform: gpio
    id: ls_in
    name: "Light switch"
    icon: mdi:lightbulb
    pin:
      number: GPIO16
      mode: INPUT               # 10k/22k divider from the ISP814 output on 439155, idle high
      inverted: true            # live switch = 100 Hz low pulses
    filters:
      - delayed_off: 60ms       # bridge the gaps between the mains pulses
      - delayed_on: 500ms       # ignore spikes
    on_state:
      - lambda: |-
          // boost while on is done by the control script; here only the overrun after a real on -> off change
          // (not on the first state published after boot)
          static int prev = -1;
          if (prev == 1 && !x && id(ls_boost).state) {
            id(boost_end) = millis() + (uint32_t) (id(boost_minutes).state * 60000.0f);
            if (id(boost_end) == 0) id(boost_end) = 1;
          }
          prev = x ? 1 : 0;
      - script.execute: control
  - platform: template
    name: "Bypass open"           # = bypass RELAY on (commanded); the flap position is not measured
    icon: mdi:valve-open
    lambda: return id(bypass_relay).state;
  - platform: template
    id: ext_fault
    name: "Extract fan fault"
    device_class: problem
    lambda: return id(ext_fault_l);   # latched in the control script
  - platform: template
    id: sup_fault
    name: "Supply fan fault"
    device_class: problem
    lambda: return id(sup_fault_l);
  - platform: template
    name: "Frost protection"
    icon: mdi:snowflake-alert
    lambda: return id(frost_active) || id(frost_safe);
  - platform: template
    name: "Dry air protection active"
    icon: mdi:water-percent-alert
    lambda: return id(dry_active);
  - platform: template
    name: "Room too cold"
    icon: mdi:thermometer-alert
    lambda: return id(cold_stop);
  - platform: template
    name: "Temperature sensor fault"
    device_class: problem
    lambda: |-
      const uint32_t now = millis();
      if (!id(boot_done)) return false;
      auto stale = [now](uint32_t t) { return t == 0 || (now - t) > 120000UL; };
      return stale(id(t1_ok_ms)) || stale(id(t2_ok_ms));
  - platform: template
    name: "Filter change needed"
    device_class: problem
    icon: mdi:air-filter
    lambda: |-
      if (!id(cfg_ready)) return false;
      auto &c = id(cfg);
      const uint32_t now = millis();
      const uint32_t ts = c[40] | (c[41] << 8) | (c[42] << 16) | ((uint32_t) c[43] << 24);
      const uint32_t run_h = c[44] | (c[45] << 8);
      auto t = id(sntp_time).now();
      if (ts != 0 && t.is_valid() && ((int64_t) t.timestamp - (int64_t) ts) / 86400.0f >= id(filter_days).state) return true;
      if (run_h - std::min(run_h, (uint32_t) (c[100] | (c[101] << 8))) < ${filter_learn_h}) return false;
      const float al = id(filter_alarm).state;
      const bool fe = id(fil_eval_e) != 0 && (now - id(fil_eval_e)) < ${fil_fresh_ms};   // same window as the text:
      const bool fsp = id(fil_eval_s) != 0 && (now - id(fil_eval_s)) < ${fil_fresh_ms};  // 30 min ON needs samples throughout
      return (fe && fabsf(id(fil_dev_e)) > al) || (fsp && fabsf(id(fil_dev_s)) > al);
    filters: [delayed_on: 30min]

sensor:
  - platform: template
    id: sup_level
    name: "Supply fan level"
    unit_of_measurement: "%"
    icon: mdi:fan
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ext_level
    name: "Extract fan level"
    unit_of_measurement: "%"
    icon: mdi:fan
    accuracy_decimals: 0
    update_interval: never

  # tacho: 1 pulse per revolution -> pulses/min = rpm
  - platform: pulse_counter
    id: fan1_rpm
    name: "Extract fan speed (FAN1)"
    pin:
      number: GPIO6
      mode: INPUT
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    update_interval: 10s
    internal_filter: 10us       # ESP32 PCNT filter max ~12.8 us; the 1k + 1n RC does the rest
  - platform: pulse_counter
    id: fan2_rpm
    name: "Supply fan speed (FAN2)"
    pin:
      number: GPIO7
      mode: INPUT
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    update_interval: 10s
    internal_filter: 10us       # ESP32 PCNT filter max ~12.8 us; the 1k + 1n RC does the rest

  # --- NTC readout: two ADC1 channels (rev E)
  - platform: adc
    id: ntc1_adc
    pin: GPIO1
    attenuation: 12db           # 0 .. ~3.1 V
    update_interval: never
    internal: true
  - platform: adc
    id: ntc2_adc
    pin: GPIO2
    attenuation: 12db
    update_interval: never
    internal: true
  - platform: template
    id: ntc1_r
    name: "TEMP1 NTC resistance"
    entity_category: diagnostic
    unit_of_measurement: "Ω"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ntc2_r
    name: "TEMP2 NTC resistance"
    entity_category: diagnostic
    unit_of_measurement: "Ω"
    accuracy_decimals: 0
    update_interval: never
  - platform: ntc
    id: temp_extract
    sensor: ntc1_r
    name: "Extract air temperature (TEMP1)"
    calibration:
      b_constant: ${ntc_b}
      reference_temperature: 25°C
      reference_resistance: ${ntc_r25}
    filters:
      - median:                  # single readings jump by +-1.5 C; validity is tracked from the raw R (t1_ok_ms)
          window_size: 5
          send_every: 1
          send_first_at: 1
  - platform: ntc
    id: temp_outdoor
    sensor: ntc2_r
    name: "Outdoor air temperature (TEMP2)"
    calibration:
      b_constant: ${ntc_b}
      reference_temperature: 25°C
      reference_resistance: ${ntc_r25}
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  # --- filter
  - platform: template
    name: "Filter age"
    icon: mdi:air-filter
    unit_of_measurement: "d"
    accuracy_decimals: 0
    update_interval: 10min
    lambda: |-
      auto &c = id(cfg);
      const uint32_t ts = c[40] | (c[41] << 8) | (c[42] << 16) | ((uint32_t) c[43] << 24);
      auto t = id(sntp_time).now();
      if (!id(cfg_ready) || ts == 0 || !t.is_valid()) return NAN;
      return ((int64_t) t.timestamp - (int64_t) ts) / 86400.0f;
  - platform: template
    name: "Filter days left"
    icon: mdi:calendar-clock
    unit_of_measurement: "d"
    accuracy_decimals: 0
    update_interval: 10min
    lambda: |-
      auto &c = id(cfg);
      const uint32_t ts = c[40] | (c[41] << 8) | (c[42] << 16) | ((uint32_t) c[43] << 24);
      auto t = id(sntp_time).now();
      if (!id(cfg_ready) || ts == 0 || !t.is_valid()) return NAN;
      return id(filter_days).state - ((int64_t) t.timestamp - (int64_t) ts) / 86400.0f;
  - platform: template
    name: "Filter run hours"
    icon: mdi:timer-outline
    entity_category: diagnostic
    unit_of_measurement: "h"
    accuracy_decimals: 0
    update_interval: 10min
    lambda: return (float) (id(cfg)[44] | (id(cfg)[45] << 8));
  - platform: template
    name: "Extract filter rpm deviation"
    icon: mdi:air-filter
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: return id(fil_dev_e);
  - platform: template
    name: "Supply filter rpm deviation"
    icon: mdi:air-filter
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: return id(fil_dev_s);

  # --- values from HA (only used while fresh and the API is connected)
  - platform: homeassistant
    id: indoor_rh
    entity_id: ${ha_indoor_rh}
    internal: true
    on_value:
      - lambda: id(rh_ms) = millis();
  - platform: homeassistant
    id: ha_indoor_t
    entity_id: ${ha_indoor_t}
    internal: true
    on_value:
      - lambda: id(ha_tin_ms) = millis();
  - platform: homeassistant
    id: ha_outdoor
    entity_id: ${ha_outdoor}
    internal: true
    on_value:
      - lambda: id(ha_out_ms) = millis();

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

  # --- rev E: 4x DS18B20 on the 1-Wire bus (addresses: substitutions, see the header)
  - platform: dallas_temp
    id: ds_outdoor
    address: ${ds_outdoor}
    name: "Outdoor air temperature (DS18B20)"
    update_interval: 30s
    on_value:
      - lambda: if (std::isfinite(x) && x > -40.0f && x < 70.0f) id(ds_out_ms) = millis();
  - platform: dallas_temp
    id: ds_supply
    address: ${ds_supply}
    name: "Supply air temperature (DS18B20)"
    update_interval: 30s
  - platform: dallas_temp
    id: ds_extract
    address: ${ds_extract}
    name: "Extract air temperature (DS18B20)"
    update_interval: 30s
    on_value:
      - lambda: if (std::isfinite(x) && x > -40.0f && x < 70.0f) id(ds_ext_ms) = millis();
  - platform: dallas_temp
    id: ds_exhaust
    address: ${ds_exhaust}
    name: "Exhaust air temperature (DS18B20)"
    update_interval: 30s
  - platform: template
    name: "Heat recovery efficiency"
    icon: mdi:heat-wave
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      // supply-side efficiency (supply - outdoor) / (extract - outdoor); only with the bypass closed and a
      // meaningful temperature difference, otherwise NAN
      const float o = id(ds_outdoor).state, s = id(ds_supply).state, e = id(ds_extract).state;
      if (!std::isfinite(o) || !std::isfinite(s) || !std::isfinite(e) || id(bypass_relay).state) return NAN;
      if (fabsf(e - o) < 5.0f) return NAN;
      return std::min(110.0f, std::max(-10.0f, (s - o) * 100.0f / (e - o)));

  # --- rev E: I2C sensors (a missing sensor only marks its component failed)
  - platform: sht4x
    temperature:
      name: "SHT4x temperature"
    humidity:
      id: sht_rh
      name: "SHT4x humidity"
      on_value:
        - lambda: if (std::isfinite(x) && x > 5.0f && x < 100.0f) id(sht_ms) = millis();
    update_interval: 30s
  - platform: scd4x
    co2:
      name: "CO2"
    temperature:
      name: "SCD41 temperature"
      entity_category: diagnostic
    humidity:
      name: "SCD41 humidity"
      entity_category: diagnostic
    update_interval: 60s

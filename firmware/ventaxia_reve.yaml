# MVHR control board REV E: ESP32-S3-DevKitC-1-N8R8 in sockets (hw/mvhr_ctrl), replaces control board 439150.
# Connects to J10 of power board 439155 with the 34-pin ribbon. Schematic: hw/mvhr_ctrl/mvhr_ctrl_schematic.pdf.
# Control logic runs ON THE ESP (hw/REKUPERACE.md): Home Assistant only changes the mode / parameters and shows
# the state. Without HA (or Wi-Fi) the unit keeps running with the last settings (stored in flash).
# GENERATED by hw/firmware/gen/gen_fw.py from gen/fw_template.yaml (logic shared with the alpha) + gen/reve.py
# (rev E hardware) - edit those, not this file.
#
# Pin map (DevKit GPIO):
#   GPIO4   FAN1 PWM (EXTRACT)  -> R20 4k7 -> Q3 -> Q1 -> J10 pin 14     NON-inverted: GPIO high = fan runs
#   GPIO5   FAN2 PWM (SUPPLY)   -> R40 4k7 -> Q4 -> Q2 -> J10 pin 22
#           Q1/Q2 are biased ON from the motor +10 V (R21/R41 22k) = PWM line low = STOP whenever the GPIO is low,
#           floating (reset, flashing), the DevKit is unplugged or the 3V3 / 5V of this board is lost.
#           NEVER make the PWM outputs inverted (the alpha had them inverted): it would swap stop and full speed.
#   GPIO6   FAN1 tacho  <- J10 pin 10 (10k pull-up to 3V3, 1k + 1n), PCNT
#   GPIO7   FAN2 tacho  <- J10 pin 18
#   GPIO15  bypass      -> R11 1k -> J10 pin 26 (BC337 + relay RL1 on 439155), R12 10k pull-down = off in reset
#   GPIO16  LS input    <- J10 pin 13 (ISP814 on 439155: 100 Hz low pulses while the light switch is live)
#   GPIO1   NTC1 TEMP1 (extract air)  ADC1_CH0, 10k pull-up to 3V3, NTC to GND, 1k + 100n
#   GPIO2   NTC2 TEMP2 (outdoor)      ADC1_CH1
#   GPIO17  1-Wire: 4x DS18B20 (J4 OUTDOOR, J5 SUPPLY, J6 EXTRACT, J7 EXHAUST), 4k7 pull-up
#   GPIO8/9 I2C SDA/SCL: SHT4x 0x44 (J8), SCD41 0x62 (J9), 4k7 pull-ups, 100R in series
#   GPIO18  LED D3 (status_led: off = OK, blinking = warning / error)
# Watchdog: ESPHome on ESP32 subscribes its main loop to the ESP-IDF task watchdog - a hung program resets the chip,
# the GPIOs float and the fans STOP (hardware default). Keep it that way (review E-02).
# DS18B20 addresses: unknown until the sensors are wired. After the first flash the log lists the found devices
# ("one_wire ... Found devices: 0x..."); put them into the ds_* substitutions and regenerate. A missing / zero
# address only gives NAN for that sensor.
# First version for rev E (18.10.2026): the control is the alpha one; DS18B20 EXTRACT / OUTDOOR back up TEMP1 /
# TEMP2 before the HA values, the SHT4x backs up the HA humidity for the dry air protection, the light switch
# input boosts. CO2 / humidity demand control is not active yet (sensors are only published).
#
# Settings storage (review 17.10., P1): the ESP8266 flash preference area is only 512 B and every restored entity
# costs its size + 4 B. All settings, the filter data and the clean-filter reference live in ONE versioned record
# "cfg" (std::array<uint8_t, 128>, ~136 B in flash). Entities are not restored on their own; at boot they are
# filled from cfg and every change is written back. New settings go into the spare bytes (102-127) with a default
# in cfg_init, so a flash no longer resets anything. Changing cfg_version resets everything to the defaults.
#   cfg[0] magic, [1] version, [2] mode, [3] flags (bit0 frost Bypass mode, bits 1-7 switches),
#   [4-30] numbers (see the number list), [31-34] night times h/m ([35-38] free: former weekend night times), [40-43] filter change unix time,
#   [44-45] filter run hours, [46-63] extract / [64-81] supply clean-filter rpm/16 for PWM 15..100 % (5 % steps),
#   [82] filter epoch (+1 on "Filter replaced"), [83] record layout (settings added later get their default),
#   [84] airing slot enable bits, [85-90] airing times h/m, [91] airing minutes, [92-93] airing supply/extract %,
#   [94-96] extract / [97-99] supply: clean-filter reference COMPLETE bit per PWM step (60 samples = 10 min),
#   [100-101] filter run hours when the current calibration started ("Filter replaced" = 0, "Filter recalibrate")
#   [102] weekend airing offset in hours (layout 3)
#
# Control (every 10 s and on every change, script "control"): first the DEMAND, then the PROTECTIONS.
#  Demand (later lines win):
#   Mode   Auto | Low | Normal | Boost | Manual. Auto = Normal; Manual = HA sets both fans, ends after 2 h and
#          is never restored after a reboot (Auto)
#   Night  Auto: "Night start".."Night end" (22:00-08:00) at "Night supply/extract %" (40/40); with "Weekend night
#          times" the Fri/Sat evening start and the Sat/Sun morning end move by "Weekend airing offset"
#          (22:00 + 1 h = 23:00, 08:00 + 1 h = 09:00)
#   Holiday switch (HA mirrors input_boolean.dovolena): Holiday supply/extract % (25/30) instead of Auto/Low/Normal
#   Boost  button = Boost levels for "Boost duration" minutes
#   Airing three daily times ("Airing 1-3 time", 08:00 / 12:00 / 19:00, each with "Airing N enabled"): in Auto
#          (not on holiday, not during a boost) "Airing supply/extract %" (100/100) for "Airing duration" (30 min).
#          On Sat / Sun with "Weekend night times" all three move by "Weekend airing offset" (0-4 h, default 1 h).
#          Wins over night mode, not over the fireplace / cooker hood; protections (frost, cold, faults) still
#          apply, dry air protection does not cap it
#   Fire   "Fireplace" button: supply 60 / extract 30 % (more supply than extract by PWM - airflow is not measured)
#          for "Fireplace duration" minutes to help lighting the stove
#   Bypass summer: open when extract > comfort AND outdoor < extract - 2 AND outdoor > outdoor minimum,
#          close with 2 / 1 / 1 C hysteresis, at most one change per 10 min ("Summer bypass" enables it)
#   Cool   "Free cooling": summer bypass open, Auto (also on holiday), outdoor >= 3 C below extract -> fans at
#          least at "Free cooling supply/extract %"
#   Hood   "Cooker hood" switch (HA, from the hood's power): extract 0 %, supply 60 % as make-up air; off after 2 h
#  Protections (all modes, Manual included, in this order):
#   Start  first 2 min after boot without a valid outdoor temperature: Low, no bypass decisions
#   Cold   extract < 5 C (heating failure) -> both fans stop, 5 min test run at Low every hour. It is only
#          released by a VALID reading > 7 C; losing TEMP1 keeps it. House temperature: TEMP1, else HA (15 min)
#   Dry    "Dry air protection": indoor RH from HA (median of the Zigbee rooms, max 30 min old, API connected)
#          below "Humidity minimum" -> Auto at most Low (also caps free cooling); 3 % hysteresis
#   Frost  outdoor below "Frost start" (1 C hysteresis). Bypass mode: bypass open (also while the cooker hood runs).
#          Airflow mode: supply reduced linearly to 50 % at -10 C, -10..-20 C supply stops 15 min every hour,
#          <= -20 C supply off and extract at most Low (Vent-Axia default)
#          Outdoor temperature: TEMP2, or the HA weather station when TEMP2 has no valid reading for 2 min.
#          Neither valid -> frost SAFE mode: Bypass mode = bypass open + Low, Airflow mode = supply half of Low.
#          Airflow mode always CLOSES the bypass while frost is active (air through the core), Manual included
#   NTC    a resistance outside 500 Ohm .. 150 kOhm is published as NAN (never reaches the median); temperatures
#          are used only when finite, -40..70 C and their last valid raw reading is < 2 min old
#   Fan    a fan driven > 20 % (applied PWM) with no valid tacho (< 100 rpm or none) for 60 s = LATCHED fault.
#          The OTHER fan stops at once (fault_other_pct = 0 %, bypassing the comfort ramp): no underpressure against
#          the stove when the supply fan dies. The faulty fan keeps its demand; the fault clears only after 30 s of
#          valid tacho while driven. Both faulty: both stopped, test run at fault_test_pct (30 %) for the last 2 min
#          of every 15 min - a fan that answers is released
#   Ramp   fans follow the target at "Fan ramp rate" %/s (soft start after boot)
#   Filter "Filter replaced" resets age, run hours and the clean-filter reference; "Filter change needed" after
#          "Filter change interval" days or when the rpm at the same PWM drifts > "Filter clog alarm" % from the
#          reference learned in the first 72 run hours (a PWM step first seen later: 10 min, up to 720 h);
#          "Filter recalibrate" learns a new reference without touching the filter age (windows count from then);
#          a deviation counts (text AND alarm) only with a usable sample in the last 15 min; a reference step is used
#          only when complete (10 min of samples, completion bit stored, an interrupted one continues after reboot)

substitutions:
  pwm_freq: 1000 Hz            # ebm-papst R3G146: PWM 1-10 kHz
  ntc_b: "3950"                # estimate from ~6 kOhm at 21 C (5k @ 25 C, B 3950) - calibrate against the unit display
  ntc_r25: 5kOhm
  ntc_interval: 30s
  cfg_magic: "0xA5"
  cfg_version: "1"
  filter_learn_h: "72"         # run hours after a filter change: learn the clean-filter rpm of every PWM step seen
  filter_late_h: "720"         # until then a PWM step not seen yet is still learned (10 min of samples), e.g. Boost
  ha_outdoor: sensor.meteostanice_meteostanice_teplota   # backup outdoor temperature (roof weather station)
  ha_indoor_rh: sensor.dum_vlhkost_median_zigbee         # min_max helper, median of the Zigbee room sensors
  ha_indoor_t: sensor.dum_prumerna_teplota_zigbee        # min_max helper, backup for TEMP1 (house temperature)
  ha_max_age_ms: "900000UL"    # HA values older than 15 min are ignored (receive time; HA resends on reconnect)
  fault_other_pct: "0"         # fan fault: the OTHER fan's PWM % (fixed policy, not the user's Low level)
  fault_test_pct: "30"         # both fans faulty: test run PWM % (last 2 min of every 15 min)
  fil_fresh_ms: "900000UL"     # filter deviation counts (text + alarm) only with a sample in the last 15 min
  ds_outdoor: "0x0000000000000001"   # DS18B20 addresses from the log after the first flash (see the header)
  ds_supply: "0x0000000000000002"
  ds_extract: "0x0000000000000003"
  ds_exhaust: "0x0000000000000004"

esphome:
  name: ventaxia-reve
  friendly_name: Vent-Axia
  on_boot:
    - priority: -50               # after all components: load the settings record into the entities
      then:
        - lambda: |-
            auto &c = id(cfg);
            if (c[0] != ${cfg_magic} || c[1] != ${cfg_version}) {
              ESP_LOGW("cfg", "settings record missing or old - defaults");
              c.fill(0);
              c[0] = ${cfg_magic};
              c[1] = ${cfg_version};
              c[2] = 0;                        // mode Auto
              c[3] = 0x01;                     // bit0 frost Bypass mode (stove in the house, our choice 16.10.2026)
              c[4] = 35;                       // Low supply % = 35
              c[5] = 40;                       // Low extract % = 40
              c[6] = 50;                       // Normal supply % = 50
              c[7] = 55;                       // Normal extract % = 55
              c[8] = 75;                       // Boost supply % = 75
              c[9] = 80;                       // Boost extract % = 80
              c[10] = 40;                      // Night supply % = 40
              c[11] = 40;                      // Night extract % = 40
              c[12] = 25;                      // Holiday supply % = 25
              c[13] = 30;                      // Holiday extract % = 30
              c[14] = 60;                      // Free cooling supply % = 60
              c[15] = 60;                      // Free cooling extract % = 60
              c[16] = 60;                      // Fireplace supply % = 60
              c[17] = 30;                      // Fireplace extract % = 30
              c[18] = 60;                      // Cooker hood supply % = 60
              c[19] = 0;                       // Cooker hood extract % = 0
              c[20] = 50;                      // Manual supply % = 50
              c[21] = 55;                      // Manual extract % = 55
              c[22] = 35;                      // Humidity minimum = 35
              c[23] = 15;                      // Fireplace duration = 15
              c[24] = 30;                      // Boost duration = 30
              c[25] = 4;                       // Fan ramp rate = 2
              c[26] = 48;                      // Bypass comfort temperature = 24
              c[27] = 28;                      // Bypass outdoor minimum = 14
              c[28] = 40;                      // Frost protection start = 0
              c[29] = 18;                      // Filter change interval = 180
              c[30] = 15;                      // Filter clog alarm = 15
              c[3] |= (1 << 1);                // Summer bypass = on
              c[3] |= (1 << 2);                // Night mode = on
              c[3] &= ~(1 << 3);               // Holiday = off
              c[3] |= (1 << 4);                // Dry air protection = on
              c[3] |= (1 << 5);                // Free cooling = on
              c[3] |= (1 << 6);                // Weekend night times = on
              c[3] &= ~(1 << 7);               // Manual bypass = off
              c[84] |= (1 << 3);               // Light switch boost = on
              c[31] = 22; c[32] = 0;           // Night start
              c[33] = 8; c[34] = 0;            // Night end
            }
            if (c[83] < 1) {                  // settings added in layout 1
              c[91] = 30;                      // Airing duration = 30
              c[92] = 100;                     // Airing supply % = 100
              c[93] = 100;                     // Airing extract % = 100
              c[84] |= (1 << 0);               // Airing 1 enabled = on
              c[84] |= (1 << 1);               // Airing 2 enabled = on
              c[84] |= (1 << 2);               // Airing 3 enabled = on
              c[85] = 8; c[86] = 0;            // Airing 1 time
              c[87] = 12; c[88] = 0;           // Airing 2 time
              c[89] = 19; c[90] = 0;           // Airing 3 time
            }
            if (c[83] < 2) {                  // settings added in layout 2
              // layout 2 (review 4): references from layout 1 have no completion bit. They cannot be trusted as
              // complete, so the calibration restarts NOW (base = current run hours) - old values are only the start
              // of the new average; the filter age (cfg[40-43]) is kept.
              for (int i = 94; i < 100; i++) c[i] = 0;
              c[100] = c[44]; c[101] = c[45];
            }
            if (c[83] < 3) {                  // settings added in layout 3
              c[102] = 1;                      // Weekend airing offset = 1
            }
            c[83] = 3;
            if (c[2] > 3) c[2] = 0;       // Manual never survives a reboot (review P1-3)
            auto num = [](number::Number *n, float v, float mn, float mx, float d) {
              n->publish_state((v >= mn && v <= mx) ? v : d);
            };
            num(id(low_sup), c[4], 0.0f, 100.0f, 35.0f);
            num(id(low_ext), c[5], 0.0f, 100.0f, 40.0f);
            num(id(norm_sup), c[6], 0.0f, 100.0f, 50.0f);
            num(id(norm_ext), c[7], 0.0f, 100.0f, 55.0f);
            num(id(boost_sup), c[8], 0.0f, 100.0f, 75.0f);
            num(id(boost_ext), c[9], 0.0f, 100.0f, 80.0f);
            num(id(night_sup), c[10], 0.0f, 100.0f, 40.0f);
            num(id(night_ext), c[11], 0.0f, 100.0f, 40.0f);
            num(id(hol_sup), c[12], 0.0f, 100.0f, 25.0f);
            num(id(hol_ext), c[13], 0.0f, 100.0f, 30.0f);
            num(id(cool_sup), c[14], 0.0f, 100.0f, 60.0f);
            num(id(cool_ext), c[15], 0.0f, 100.0f, 60.0f);
            num(id(fire_sup), c[16], 0.0f, 100.0f, 60.0f);
            num(id(fire_ext), c[17], 0.0f, 100.0f, 30.0f);
            num(id(hood_sup), c[18], 0.0f, 100.0f, 60.0f);
            num(id(hood_ext), c[19], 0.0f, 100.0f, 0.0f);
            num(id(man_sup), c[20], 0.0f, 100.0f, 50.0f);
            num(id(man_ext), c[21], 0.0f, 100.0f, 55.0f);
            num(id(rh_min), c[22], 20.0f, 50.0f, 35.0f);
            num(id(fire_minutes), c[23], 5.0f, 60.0f, 15.0f);
            num(id(boost_minutes), c[24], 5.0f, 120.0f, 30.0f);
            num(id(ramp_rate), c[25] / 2.0f, 0.5f, 20.0f, 2.0f);
            num(id(comfort_temp), c[26] / 2.0f, 16.0f, 30.0f, 24.0f);
            num(id(outdoor_min), c[27] / 2.0f, 5.0f, 20.0f, 14.0f);
            num(id(frost_start), c[28] / 2.0f - 20.0f, -10.0f, 5.0f, 0.0f);
            num(id(filter_days), c[29] * 10.0f, 30.0f, 730.0f, 180.0f);
            num(id(filter_alarm), c[30], 3.0f, 50.0f, 15.0f);
            num(id(purge_minutes), c[91], 5.0f, 120.0f, 30.0f);
            num(id(purge_sup), c[92], 0.0f, 100.0f, 100.0f);
            num(id(purge_ext), c[93], 0.0f, 100.0f, 100.0f);
            num(id(purge_we_h), c[102], 0.0f, 4.0f, 1.0f);
            id(summer_mode).publish_state((c[3] >> 1) & 1);
            id(night_mode).publish_state((c[3] >> 2) & 1);
            id(holiday_mode).publish_state((c[3] >> 3) & 1);
            id(dry_protect).publish_state((c[3] >> 4) & 1);
            id(free_cooling).publish_state((c[3] >> 5) & 1);
            id(weekend_night).publish_state((c[3] >> 6) & 1);
            id(man_bypass).publish_state((c[3] >> 7) & 1);
            id(purge_on_1).publish_state((c[84] >> 0) & 1);
            id(purge_on_2).publish_state((c[84] >> 1) & 1);
            id(purge_on_3).publish_state((c[84] >> 2) & 1);
            id(ls_boost).publish_state((c[84] >> 3) & 1);
            id(night_start).make_call().set_time(c[31] % 24, c[32] % 60, 0).perform();
            id(night_end).make_call().set_time(c[33] % 24, c[34] % 60, 0).perform();
            id(purge_1).make_call().set_time(c[85] % 24, c[86] % 60, 0).perform();
            id(purge_2).make_call().set_time(c[87] % 24, c[88] % 60, 0).perform();
            id(purge_3).make_call().set_time(c[89] % 24, c[90] % 60, 0).perform();
            id(cfg_ready) = true;
        - script.execute: control

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB               # N8R8; the octal PSRAM (GPIO35-37) is not used
  framework:
    type: esp-idf

preferences:
  flash_write_interval: 5min    # the record is written at most every 5 min (flash wear)

logger:                         # USB / UART log free on rev E (no pin shared with the NTCs)

api:
  reboot_timeout: 0s            # review D-09: keep controlling the unit when HA is down (default reboots after 15 min)
  encryption:
    key: !secret api_encryption_key   # review P1-6; HA asks for this key once after the first flash

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # use_address: 192.168.10.x   # set once the board has a DHCP reservation (the Builder had no mDNS on the alpha)
  reboot_timeout: 0s            # review D-09: no reboot when the AP is down (fallback AP still starts)
  ap:
    ssid: "ventaxia-reve"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

time:
  - platform: sntp                # internet time - the night schedule works without HA
    id: sntp_time
    timezone: Europe/Prague

datetime:
  - platform: template
    id: night_start
    name: "Night start"
    type: time
    optimistic: true
    initial_value: "22:00:00"
    entity_category: config
    on_value:
      - lambda: "if (id(cfg_ready)) { id(cfg)[31] = id(night_start).hour; id(cfg)[32] = id(night_start).minute; }"
      - script.execute: control
  - platform: template
    id: night_end
    name: "Night end"
    type: time
    optimistic: true
    initial_value: "08:00:00"
    entity_category: config
    on_value:
      - lambda: "if (id(cfg_ready)) { id(cfg)[33] = id(night_end).hour; id(cfg)[34] = id(night_end).minute; }"
      - script.execute: control
  - platform: template
    id: purge_1
    name: "Airing 1 time"
    type: time
    optimistic: true
    initial_value: "08:00:00"
    entity_category: config
    on_value:
      - lambda: "if (id(cfg_ready)) { id(cfg)[85] = id(purge_1).hour; id(cfg)[86] = id(purge_1).minute; }"
      - script.execute: control
  - platform: template
    id: purge_2
    name: "Airing 2 time"
    type: time
    optimistic: true
    initial_value: "12:00:00"
    entity_category: config
    on_value:
      - lambda: "if (id(cfg_ready)) { id(cfg)[87] = id(purge_2).hour; id(cfg)[88] = id(purge_2).minute; }"
      - script.execute: control
  - platform: template
    id: purge_3
    name: "Airing 3 time"
    type: time
    optimistic: true
    initial_value: "19:00:00"
    entity_category: config
    on_value:
      - lambda: "if (id(cfg_ready)) { id(cfg)[89] = id(purge_3).hour; id(cfg)[90] = id(purge_3).minute; }"
      - script.execute: control

output:
  # rev E: NON-inverted. Level 1.0 = GPIO high = Q3/Q4 on = Q1/Q2 off = PWM line pulled to motor +10 V = 100 %
  - platform: ledc
    id: fan1_pwm                # EXTRACT
    pin: GPIO4
    frequency: ${pwm_freq}
  - platform: ledc
    id: fan2_pwm                # SUPPLY
    pin: GPIO5
    frequency: ${pwm_freq}

status_led:
  pin: GPIO18                   # D3: off = OK, blinking = warning / error

one_wire:
  - platform: gpio
    pin: GPIO17

i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 100kHz             # 100R series resistors + cables: stay slow

globals:
  - id: cfg                     # THE settings record, see the header
    type: std::array<uint8_t, 128>
    restore_value: true
  - id: cfg_ready               # entities loaded from cfg; before that their on_value must not write back
    type: bool
    initial_value: "false"
  - id: ds_ext_ms               # millis() of the last valid DS18B20 EXTRACT / OUTDOOR reading (backup of TEMP1/2)
    type: uint32_t
    initial_value: "0"
  - id: ds_out_ms
    type: uint32_t
    initial_value: "0"
  - id: sht_ms                  # millis() of the last valid SHT4x humidity (backup of the HA humidity)
    type: uint32_t
    initial_value: "0"
  - id: t1_ok_ms                # millis() of the last plausible raw TEMP1 / TEMP2 reading (0 = none yet)
    type: uint32_t
    initial_value: "0"
  - id: t2_ok_ms
    type: uint32_t
    initial_value: "0"
  - id: ha_out_ms               # millis() of the last backup outdoor / indoor RH value from HA
    type: uint32_t
    initial_value: "0"
  - id: rh_ms
    type: uint32_t
    initial_value: "0"
  - id: boost_end               # millis() when the boost button run ends, 0 = no boost
    type: uint32_t
    initial_value: "0"
  - id: fire_end                # millis() when the fireplace run ends, 0 = off
    type: uint32_t
    initial_value: "0"
  - id: frost_active
    type: bool
    initial_value: "false"
  - id: frost_safe              # no valid outdoor temperature: frost safe mode
    type: bool
    initial_value: "false"
  - id: frost_since
    type: uint32_t
    initial_value: "0"
  - id: boot_done               # set once 2 min after boot; survives the millis() wrap (review 2, P2-6)
    type: bool
    initial_value: "false"
  - id: ha_tin_ms
    type: uint32_t
    initial_value: "0"
  - id: ext_fault_l             # LATCHED fan faults (review 3): set after 60 s driven without tacho, cleared only
    type: bool                  # after 30 s of valid tacho while driven - not by the protective PWM reduction
    initial_value: "false"
  - id: sup_fault_l
    type: bool
    initial_value: "false"
  - id: fault_t                 # millis() when the second fan fault latched (test-run timing)
    type: uint32_t
    initial_value: "0"
  - id: cold_stop
    type: bool
    initial_value: "false"
  - id: cold_since
    type: uint32_t
    initial_value: "0"
  - id: dry_active
    type: bool
    initial_value: "false"

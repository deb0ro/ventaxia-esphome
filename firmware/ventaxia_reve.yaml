select:
  - platform: template
    id: mode_select
    name: "Mode"
    icon: mdi:fan-auto
    options: [Auto, Low, Normal, Boost, Manual]
    update_interval: 2s
    lambda: |-
      static const char *const o[] = {"Auto", "Low", "Normal", "Boost", "Manual"};
      const int i = id(cfg)[2];
      return std::string(o[(i >= 0 && i <= 4) ? i : 0]);
    set_action:
      - lambda: |-
          static const char *const o[] = {"Auto", "Low", "Normal", "Boost", "Manual"};
          for (int i = 0; i < 5; i++) if (x == o[i]) id(cfg)[2] = i;
      - if:
          condition:
            lambda: return id(cfg)[2] == 4;
          then:
            - script.execute: manual_timeout
          else:
            - script.stop: manual_timeout
      - script.execute: control
  - platform: template
    id: frost_mode_select
    name: "Frost protection mode"
    icon: mdi:snowflake-alert
    entity_category: config
    options: [Airflow, Bypass]
    update_interval: 10s
    lambda: |-
      return std::string((id(cfg)[3] & 1) ? "Bypass" : "Airflow");
    set_action:
      - lambda: |-
          if (x == "Bypass") id(cfg)[3] |= 1; else id(cfg)[3] &= ~1;
      - script.execute: control


<text x="518" y="460" font-size="14" text-anchor="middle">bílý výřez = klíč boxu, míří DOVNITŘ desky (k paticím DevKitu); pin 1 = čtvercová ploška vlevo dole, △ na potisku</text>
<text x="30" y="545" font-size="14">24V: piny 1/2 (29 V naprázdno) -> F1 -> D1 -> TSR. GND: 5-8, 12, 20, 28, 32 (12/20 = zem motorů, na 439155 oddělené, na desce E spojené s GND).</text>
<text x="30" y="567" font-size="14">FAN1 = ODTAH (10 tacho, 14 PWM, 16 +10 V), FAN2 = PŘÍVOD (18 tacho, 22 PWM, 24 +10 V). PWM vstup motoru: 0 V = stop, +10 V = 100 %.</text>
<text x="30" y="589" font-size="14">13 LS (vypínač světla, ISP814 na 439155), 26 bypass (báze BC337 relé), 30 NTC1 TEMP1 odtah (28 GND), 34 NTC2 TEMP2 venku (32 GND).</text>
<text x="30" y="611" font-size="14">Šedě = nepoužito: 3/4 +5 V z 439155, 15/17/19/21 původní čidlo SHT1x, ostatní lichá 9-33 nezapojena.</text>
